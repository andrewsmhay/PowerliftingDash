services:
  powerliftingdash:
    build: .
    image: powerliftingdash:latest
    container_name: powerliftingdash
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - powerliftingdash-data:/data
    environment:
      TZ: America/Toronto

volumes:
  powerliftingdash-data:
